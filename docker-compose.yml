services:
  postgres:
    image: postgres:16-alpine
    container_name: crmanhung-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: crmanhung
      POSTGRES_PASSWORD: crmanhung
      POSTGRES_DB: crmanhung
    volumes:
      - crmanhung_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crmanhung -d crmanhung']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crmanhung_pgdata:
