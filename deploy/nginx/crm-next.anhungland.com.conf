# CRMAnHung staging — crm-next.anhungland.com
# Copy vào sites-available, bật symlink, rồi certbot.
#
# Upstream API: PM2 crmanhung-api @ 127.0.0.1:5050
# Upstream Web: PM2 crmanhung-web @ 127.0.0.1:5001 (Next.js standalone)
# Uploads:      Cloudflare R2 (public URL)
#
# Hệ cũ crm.anhungland.com giữ nguyên server block riêng (port 5000).

server {
    listen 80;
    listen [::]:80;
    server_name crm-next.anhungland.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm-next.anhungland.com;

    # Certbot quản lý các dòng ssl_certificate — hoặc điền tay sau khi cấp cert.
    # ssl_certificate     /etc/letsencrypt/live/crm-next.anhungland.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/crm-next.anhungland.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    # API NestJS — prefix /api/v1 (và /api/)
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js Web
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
