# CRMAnHung — anhungland.com (không đụng crm.*)
# Cloudflare Proxy + SSL mode Full (self-signed origin OK; Full strict cần Origin Cert).

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

upstream crmanhung_api {
    server 127.0.0.1:5050;
    keepalive 8;
}

upstream crmanhung_web {
    server 127.0.0.1:5001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name anhungland.com www.anhungland.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://anhungland.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anhungland.com www.anhungland.com;

    # Tạo trên server: /etc/ssl/cloudflare/anhungland.com.{pem,key}
    ssl_certificate     /etc/ssl/cloudflare/anhungland.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/anhungland.com.key;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://crmanhung_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://crmanhung_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
