name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-crmanhung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crmanhung
          POSTGRES_PASSWORD: crmanhung
          POSTGRES_DB: crmanhung
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crmanhung -d crmanhung"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crmanhung:crmanhung@127.0.0.1:5432/crmanhung?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @crmanhung/shared build

      - name: Prisma generate + migrate
        working-directory: apps/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Typecheck / build API
        working-directory: apps/api
        run: pnpm run build

      - name: Build Web (Next.js)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: pnpm run build

      - name: Build Extension
        run: pnpm --filter @crmanhung/extension build
