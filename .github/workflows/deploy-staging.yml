name: Deploy CRMAnHung (staging)

# Staging: anhungland.com trên VPS mới.
# KHÔNG đụng production crm.anhungland.com / anhungland-api (nếu vẫn chạy chỗ khác).
#
# Secrets bắt buộc:
#   DEPLOY_SSH_KEY  — private key user deploy
#   DEPLOY_SSH_HOST — IP (hoặc hostname) server mới
# Optional:
#   DEPLOY_SSH_USER — không dùng; user cố định `deploy`

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-crmanhung-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: deploy
      REMOTE_ROOT: '/var/www/crmanhung'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST:-}" || { echo "Missing secret DEPLOY_SSH_HOST (IP server mới)"; exit 1; }
          test -n "${SSH_KEY:-}" || { echo "Missing secret DEPLOY_SSH_KEY — xem docs/ANHUNGLAND-SETUP.md"; exit 1; }

          echo "Deploy target: ${SSH_USER}@${SSH_HOST} → ${REMOTE_ROOT}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          KEY_TRIMMED=$(printf '%s' "$SSH_KEY" | tr -d '\r')
          if printf '%s' "$KEY_TRIMMED" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "$KEY_TRIMMED" > ~/.ssh/deploy_key
          else
            printf '%s' "$KEY_TRIMMED" | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          if ! grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "DEPLOY_SSH_KEY không hợp lệ. Cần private key có BEGIN/END."
            exit 1
          fi

          ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/tmp/keyscan.err || true
          if [[ ! -s ~/.ssh/known_hosts ]]; then
            echo "ssh-keyscan thất bại:"
            cat /tmp/keyscan.err || true
            exit 1
          fi

          printf '%s\n' \
            '#!/bin/bash' \
            'exec ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$@"' \
            > "$HOME/.ssh/rsh.sh"
          chmod +x "$HOME/.ssh/rsh.sh"

          echo "REMOTE=${SSH_USER}@${SSH_HOST}" > "$HOME/.ssh/deploy.env"

          echo "Testing SSH..."
          "$HOME/.ssh/rsh.sh" "${SSH_USER}@${SSH_HOST}" "echo SSH_FROM_ACTIONS_OK"

      - name: Sync monorepo to server
        run: |
          set -euo pipefail
          source "$HOME/.ssh/deploy.env"
          RSH="$HOME/.ssh/rsh.sh"

          "$RSH" "$REMOTE" "mkdir -p ${REMOTE_ROOT}/{repo,scripts}"

          # Đồng bộ source — giữ .env trên server (Postgres + R2 secrets)
          rsync -az --delete \
            --exclude node_modules/ \
            --exclude .git/ \
            --exclude .env \
            --exclude .env.* \
            --exclude '!.env.example' \
            --exclude apps/web/.next/ \
            --exclude apps/extension/dist/ \
            -e "$RSH" \
            ./ "${REMOTE}:${REMOTE_ROOT}/repo/"

          rsync -az \
            -e "$RSH" \
            ./scripts/remote_deploy.sh "${REMOTE}:${REMOTE_ROOT}/scripts/remote_deploy.sh"

      - name: Build and restart on server
        run: |
          set -euo pipefail
          source "$HOME/.ssh/deploy.env"
          RSH="$HOME/.ssh/rsh.sh"
          "$RSH" "$REMOTE" "chmod +x ${REMOTE_ROOT}/scripts/remote_deploy.sh && CRMANHUNG_ROOT=${REMOTE_ROOT} bash ${REMOTE_ROOT}/scripts/remote_deploy.sh"

      # One-shot: only when the triggering commit message includes [seo-copy-published].
      - name: Rename published lot/address images on R2
        if: contains(github.event.head_commit.message, '[seo-copy-published]')
        run: |
          set -euo pipefail
          source "$HOME/.ssh/deploy.env"
          RSH="$HOME/.ssh/rsh.sh"
          "$RSH" "$REMOTE" "chmod +x ${REMOTE_ROOT}/repo/scripts/seo-copy-published.sh && CRMANHUNG_ROOT=${REMOTE_ROOT} bash ${REMOTE_ROOT}/repo/scripts/seo-copy-published.sh"

      # One-shot: remaining CRM Lodat photos. Copy chat-sourced lot images; keep chat files.
      - name: Rename all CRM lot/address images on R2
        if: contains(github.event.head_commit.message, '[seo-copy-all]')
        run: |
          set -euo pipefail
          source "$HOME/.ssh/deploy.env"
          RSH="$HOME/.ssh/rsh.sh"
          "$RSH" "$REMOTE" "chmod +x ${REMOTE_ROOT}/repo/scripts/seo-copy-all.sh && CRMANHUNG_ROOT=${REMOTE_ROOT} bash ${REMOTE_ROOT}/repo/scripts/seo-copy-all.sh"

      # One-shot: leftover PROJECT AddressImage UUID keys (no Lodat on /lo-dat).
      # Filename + alt = project name (Address.detail). Skip already-SEO keys and chat.
      - name: Rename leftover project-address images on R2
        if: contains(github.event.head_commit.message, '[seo-copy-orphan-addr]')
        run: |
          set -euo pipefail
          source "$HOME/.ssh/deploy.env"
          RSH="$HOME/.ssh/rsh.sh"
          "$RSH" "$REMOTE" "chmod +x ${REMOTE_ROOT}/repo/scripts/seo-copy-orphan-addresses.sh && CRMANHUNG_ROOT=${REMOTE_ROOT} bash ${REMOTE_ROOT}/repo/scripts/seo-copy-orphan-addresses.sh"

      # One-shot: CMS public-web JPEG/PNG (post cover + TipTap) → WebP.
      - name: Convert public-web post images to WebP
        if: contains(github.event.head_commit.message, '[seo-webp-posts]')
        run: |
          set -euo pipefail
          source "$HOME/.ssh/deploy.env"
          RSH="$HOME/.ssh/rsh.sh"
          "$RSH" "$REMOTE" "chmod +x ${REMOTE_ROOT}/repo/scripts/seo-webp-public-media.sh && CRMANHUNG_ROOT=${REMOTE_ROOT} bash ${REMOTE_ROOT}/repo/scripts/seo-webp-public-media.sh"
