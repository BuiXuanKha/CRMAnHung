<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>An Hưng Land Extension</title>
    <style>
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        margin: 16px;
        min-width: 320px;
        color: #14201a;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        box-sizing: border-box;
      }
      button {
        margin-top: 12px;
        padding: 8px 12px;
        cursor: pointer;
      }
      p {
        color: #475467;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>An Hưng Land CRM Extension</h1>
    <p id="versionLine">v2.12.0</p>
    <label for="apiUrl">API URL</label>
    <input id="apiUrl" type="url" placeholder="https://anhungland.com/api/v1" />
    <button id="saveBtn" type="button">Lưu</button>
    <p>Mặc định: <code>https://anhungland.com/api/v1</code>. Dev: <code>http://localhost:5050/api/v1</code>.</p>
    <p>Đăng nhập trên panel Inbox / Messenger, không trên trang này.</p>
    <p id="status"></p>
    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
